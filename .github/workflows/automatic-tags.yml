# Explicit opt-in proposal: maintainers choose when to spend runner time and download weights.
name: Automatic tags
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: automatic-tags-${{ github.ref }}
  cancel-in-progress: true
jobs:
  cpu-tags:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      LIGHTCRAFT_GPU: "0"
      LIGHTCRAFT_TAG_MODELS: ${{ github.workspace }}/target/tag-models
      RAYON_NUM_THREADS: "2"
      RUST_TEST_THREADS: "2"
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_DEV_INCREMENTAL: "false"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Rust and prime offline dependencies
        run: |
          rustup toolchain install 1.99.1 --profile minimal --component clippy --component rustfmt --target wasm32-unknown-unknown
          rustup default 1.99.1
          cargo fetch --locked
      - name: Check formatting
        run: cargo fmt --all -- --check
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: target/tag-models
          key: tag-models-${{ runner.os }}-${{ hashFiles('crates/autotag/src/lib.rs') }}
      - name: Verify pinned model files
        env:
          CARGO_NET_OFFLINE: "true"
        run: |
          cargo build --locked --offline -p lightcraft-autotag --example tagging-bench
          bench=target/debug/examples/tagging-bench
          if [[ "$RUNNER_OS" == Windows ]]; then bench="$bench.exe"; fi
          tagging_python=$(command -v python3 || command -v python)
          "$tagging_python" crates/autotag/tools/download-models.py "$bench"
      - name: Offline workspace gates and real model inference
        env:
          CARGO_NET_OFFLINE: "true"
        run: |
          cargo clippy --workspace --all-targets --locked --offline -- -D warnings
          cargo test --workspace --locked --offline
          cargo xtask parity
          cargo xtask layers
          cargo xtask assets
          cargo xtask wasm
      - name: Verify the application model installer
        env:
          CARGO_NET_OFFLINE: "true"
        # Reuse the workspace's SAM/denoise feature graph and already-built engine test binary.
        run: cargo test --workspace --locked --offline cmd::autotags::tests -- --ignored --nocapture
